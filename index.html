<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#090014;
color:white;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px;
background:#120020;
position:sticky;
top:0;
z-index:999;
}

.logo-img{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
}

.logo{
font-size:20px;
font-weight:bold;
}

.hamburger{
font-size:28px;
cursor:pointer;
}

.menu{
display:none;
position:absolute;
top:60px;
right:15px;
background:#170028;
border:1px solid #8b5cf6;
border-radius:16px;
width:220px;
overflow:hidden;
}

.menu a{
display:block;
padding:14px;
color:white;
text-decoration:none;
border-bottom:1px solid rgba(255,255,255,.1);
}

/* BANNER */
.banner img{
width:100%;
height:220px;
object-fit:cover;
}

/* CATEGORY */
.category{
display:flex;
gap:10px;
padding:12px;
overflow-x:auto;
}

.category button{
padding:14px 18px;
font-size:15px;
border:none;
border-radius:14px;
background:#7c3aed;
color:white;
font-weight:bold;
white-space:nowrap;
cursor:pointer;
min-width:120px;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
padding:14px;
}

.card{
background:#160025;
border-radius:18px;
overflow:hidden;
border:1px solid #8b5cf6;
}

.card img{
width:100%;
height:120px;
object-fit:cover;
}

.card-content{
padding:10px;
}

.btn{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
font-weight:bold;
cursor:pointer;
}

/* OVERLAY */
.overlay{
display:none;
position:fixed;
inset:0;
background:#090014;
z-index:99999;
padding:20px;
}

.step{
max-width:420px;
margin:auto;
margin-top:40px;
}

.step input{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:10px;
background:#25003d;
color:white;
}

/* QRIS */
.qris{
width:100%;
max-width:260px;
display:block;
margin:15px auto;
border-radius:18px;
box-shadow:0 0 25px rgba(139,92,246,.6);
}

/* UPLOAD */
.upload-box{
display:flex;
align-items:center;
justify-content:center;
height:110px;
border:2px dashed #8b5cf6;
border-radius:18px;
margin-top:12px;
cursor:pointer;
background:#220033;
flex-direction:column;
gap:8px;
color:white;
}

.upload-icon{
font-size:35px;
}

.btn-full{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:12px;
background:#7c3aed;
color:white;
font-weight:bold;
cursor:pointer;
}

/* CREDITS */
.credits{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
padding:8px 14px;
background:rgba(124,58,237,.15);
border:1px solid #8b5cf6;
border-radius:50px;
font-size:12px;
}

</style>

</head>

<body>

<nav>

<div style="display:flex;align-items:center;gap:10px;">
<img class="logo-img">
<div class="logo">IPUNGG SHOP</div>
</div>

<div class="hamburger" onclick="toggleMenu()">☰</div>

<div class="menu" id="menu">
<a href="admin.html">⚙️ Admin</a>
<a id="waLink">📞 WA</a>
<a id="chLink">📢 Channel</a>
<a id="grLink">👥 Group</a>
</div>

</nav>

<div class="banner">
<img id="bannerImage">
</div>

<div class="category" id="categoryBox"></div>

<div class="products" id="products"></div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">

<div class="step">

<div id="formStep">

<h2>FORM ORDER</h2>

<input type="text" id="nama" placeholder="Nama">
<input type="text" id="product" readonly>
<input type="text" id="date" readonly>

<button class="btn-full" onclick="goQRIS()">
BAYAR SEKARANG
</button>

</div>

<div id="qrisStep" style="display:none;text-align:center;">

<h2>QRIS PAYMENT</h2>

<img class="qris">

<label for="proof" class="upload-box">
<div class="upload-icon">📷</div>
<p>Upload Bukti Pembayaran</p>
</label>

<input type="file" id="proof" style="display:none;">

<button class="btn-full" onclick="sendWA()">
KIRIM KE ADMIN
</button>

</div>

</div>

</div>

<div class="credits">
© Mezuki X Ipungg - 2026
</div>

<script>

let proofURL="";

/* QRIS DEFAULT */
if(!localStorage.getItem("qris")){
localStorage.setItem("qris","https://img2.pixhost.to/images/7739/723666370_elaina-1778206415636.jpg");
}

/* BACK FIX */
history.pushState(null,null,location.href);

window.addEventListener("popstate",function(){

let overlay=document.getElementById("overlay");

if(overlay.style.display==="block"){
overlay.style.display="none";
history.pushState(null,null,location.href);
}

});

/* MENU */
function toggleMenu(){
let m=document.getElementById("menu");
m.style.display=m.style.display==="block"?"none":"block";
}

/* LOAD */
function loadSettings(){

document.querySelector(".qris").src=localStorage.getItem("qris");

let banner=localStorage.getItem("banner");
if(banner) document.getElementById("bannerImage").src=banner;

}

/* CATEGORY */
function loadCategories(){

let data=JSON.parse(localStorage.getItem("categories"))||[];

let box=document.getElementById("categoryBox");

box.innerHTML=`<button onclick="filter('all')">SEMUA</button>`;

data.forEach(c=>{
box.innerHTML+=`
<button onclick="filter('${c}')">${c.toUpperCase()}</button>
`;
});

}

/* PRODUCTS */
function loadProducts(){

let data=JSON.parse(localStorage.getItem("products"))||[];

let box=document.getElementById("products");

box.innerHTML="";

data.forEach(p=>{
box.innerHTML+=`
<div class="card ${p.category}">
<img src="${p.image}">
<div class="card-content">
<h3>${p.name}</h3>
<p>${p.price}</p>
<button class="btn" onclick="buy('${p.name}')">ORDER</button>
</div>
</div>
`;
});

}

/* FILTER */
function filter(cat){

let items=document.querySelectorAll(".card");

items.forEach(i=>{
if(cat==="all"){
i.style.display="block";
}else{
i.style.display=i.classList.contains(cat)?"block":"none";
}
});

}

/* BUY */
function buy(name){

document.getElementById("overlay").style.display="block";

document.getElementById("formStep").style.display="block";
document.getElementById("qrisStep").style.display="none";

document.getElementById("product").value="Produk: "+name;
document.getElementById("date").value=new Date().toLocaleDateString("id-ID");

history.pushState({},"","");

}

/* NEXT */
function goQRIS(){
document.getElementById("formStep").style.display="none";
document.getElementById("qrisStep").style.display="block";
}

/* UPLOAD FIX */
document.getElementById("proof").addEventListener("change",function(e){

let file=e.target.files[0];
if(!file)return;

let reader=new FileReader();

reader.onload=function(){
proofURL=reader.result;
};

reader.readAsDataURL(file);

});

/* WA SEND */
function sendWA(){

let nama=document.getElementById("nama").value;
let product=document.getElementById("product").value;
let date=document.getElementById("date").value;

let wa=localStorage.getItem("wa")||"6285198959920";

let text=`🧾 ORDER

Nama: ${nama}
${product}
${date}

📎 Bukti:
${proofURL||"Tidak diupload"}`;

window.open("https://wa.me/"+wa+"?text="+encodeURIComponent(text),"_blank");

}

/* INIT */
loadSettings();
loadCategories();
loadProducts();

</script>

</body>
  </html>
