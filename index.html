<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#090014;
color:white;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#120020;
position:sticky;
top:0;
z-index:999;
}

.nav-left{
display:flex;
align-items:center;
gap:10px;
}

.logo{
font-size:22px;
font-weight:bold;
}

.logo-img{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
box-shadow:0 0 15px #8b5cf6;
}

.hamburger{
font-size:28px;
cursor:pointer;
}

.mobile-menu{
display:none;
position:absolute;
top:70px;
right:15px;
width:240px;
background:#170028;
border:1px solid #8b5cf6;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 20px rgba(168,85,247,.6);
}

.mobile-menu a{
display:block;
padding:15px;
color:white;
text-decoration:none;
border-bottom:1px solid rgba(255,255,255,.1);
}

.banner img{
width:100%;
height:220px;
object-fit:cover;
}

.category{
display:flex;
gap:10px;
padding:14px;
overflow:auto;
}

.category button,
.btn{
flex:1;
padding:12px;
border:none;
border-radius:14px;
background:#7c3aed;
color:white;
font-weight:bold;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
padding:14px;
}

.card{
background:#160025;
border-radius:24px;
overflow:hidden;
border:1px solid #8b5cf6;
box-shadow:0 0 18px rgba(168,85,247,.5);
}

.card img{
width:100%;
height:130px;
object-fit:cover;
}

.card-content{
padding:12px;
}

.price{
margin:10px 0;
opacity:.8;
}

.overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
z-index:99999;
justify-content:center;
align-items:center;
padding:20px;
}

.popup{
width:100%;
max-width:400px;
background:#150025;
border:1px solid #8b5cf6;
padding:22px;
border-radius:24px;
}

.popup input{
width:100%;
padding:13px;
margin-bottom:12px;
border:none;
border-radius:12px;
background:#25003d;
color:white;
}

.qris{
width:220px;
display:block;
margin:auto;
border-radius:20px;
margin-top:14px;
}

.upload-box{
display:flex;
align-items:center;
justify-content:center;
height:120px;
border:2px dashed #8b5cf6;
border-radius:20px;
margin-top:15px;
cursor:pointer;
background:#220033;
flex-direction:column;
gap:10px;
}

.upload-icon{
font-size:40px;
}

.upload-text{
text-align:center;
margin-top:12px;
margin-bottom:10px;
opacity:.8;
}

.close{
float:right;
cursor:pointer;
font-size:22px;
margin-bottom:10px;
}

</style>

</head>
<body>

<nav>

<div class="nav-left">

<img 
src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png"
class="logo-img"
>

<div class="logo">IPUNGG SHOP</div>

</div>

<div class="hamburger" onclick="toggleMenu(event)">☰</div>

<div class="mobile-menu" id="menu">
<a href="https://wa.me/6285198959920">WhatsApp Admin</a>
<a href="#">Komunitas Bot WhatsApp</a>
<a href="#">Saluran Official Ipungg</a>
<a href="admin.html">Dashboard Admin</a>
</div>

</nav>

<div class="banner">
<img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1200">
</div>

<div class="category">
<button onclick="showCategory('all')">SEMUA</button>
<button onclick="showCategory('bot')">SEWA BOT</button>
<button onclick="showCategory('panel')">PANEL</button>
<button onclick="showCategory('script')">SOURCE CODE</button>
</div>

<div class="products">

<div class="card item bot">

<img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1200">

<div class="card-content">

<h3>Sewa Bot</h3>

<div class="price">Rp15.000</div>

<button class="btn" onclick="buyProduct('SEWA BOT')">
ORDER
</button>

</div>
</div>

<div class="card item panel">

<img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1200">

<div class="card-content">

<h3>Panel</h3>

<div class="price">Rp5.000</div>

<button class="btn" onclick="buyProduct('PANEL')">
ORDER
</button>

</div>
</div>

<div class="card item script">

<img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?q=80&w=1200">

<div class="card-content">

<h3>Source Code</h3>

<div class="price">Rp50.000</div>

<button class="btn" onclick="buyProduct('SOURCE CODE')">
ORDER
</button>

</div>
</div>

</div>

<div class="overlay" id="overlay">

<div class="popup">

<span class="close" onclick="closeOrder()">✕</span>

<h2>FORM ORDER</h2>

<input type="text" id="nama" placeholder="Nama Anda">

<input type="text" id="product" readonly>

<input type="text" id="date" readonly>

<input type="text" value="Payment : QRIS" readonly>

<button class="btn" onclick="showQRIS()">
BAYAR SEKARANG
</button>

<div id="qrisBox" style="display:none;">

<img 
class="qris" 
src="https://upload.wikimedia.org/wikipedia/commons/8/80/QR_code_for_mobile_English_Wikipedia.svg"
>

<p class="upload-text">
Upload Bukti Transfer
</p>

<label for="proof" class="upload-box">

<div class="upload-icon">📷</div>

<p>Pilih Bukti Transfer</p>

</label>

<input 
type="file" 
id="proof"
accept="image/*"
style="display:none;"
>

<button class="btn" onclick="sendWA()">
KIRIM KE OWNER
</button>

</div>

</div>
</div>

<script>

function toggleMenu(event){

event.stopPropagation();

const menu=document.getElementById('menu');

menu.style.display=
menu.style.display==='block'
?'none'
:'block';

}

document.addEventListener('click',function(e){

const menu=document.getElementById('menu');
const ham=document.querySelector('.hamburger');

if(!menu.contains(e.target)&&!ham.contains(e.target)){
menu.style.display='none';
}

});

function showCategory(category){

const items=document.querySelectorAll('.item');

items.forEach(item=>{

if(category==='all'){
item.style.display='block';
}

else if(item.classList.contains(category)){
item.style.display='block';
}

else{
item.style.display='none';
}

});

}

function buyProduct(name){

document.getElementById('overlay').style.display='flex';

document.getElementById('product').value=
'Produk : '+name;

document.getElementById('date').value=
'Tanggal : '+
new Date().toLocaleDateString('id-ID');

}

function closeOrder(){

document.getElementById('overlay').style.display='none';

}

function showQRIS(){

document.getElementById('qrisBox').style.display='block';

}

function sendWA(){

const nama=document.getElementById('nama').value;

const product=
document.getElementById('product').value;

const date=
document.getElementById('date').value;

const text=
`Halo Owner

Nama : ${nama}
${product}
${date}
Payment : QRIS`;

window.open(
`https://wa.me/6285198959920?text=${encodeURIComponent(text)}`,
'_blank'
);

}

</script>

</body>
  </html>
