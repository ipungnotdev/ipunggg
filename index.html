<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<style>
body{
margin:0;
font-family:Arial;
background:#090014;
color:white;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#120020;
position:sticky;
top:0;
z-index:999;
}

.logo-img{
width:38px;
height:38px;
border-radius:50%;
}

.logo{
font-weight:bold;
}

.hamburger{
font-size:26px;
cursor:pointer;
}

/* MENU */
.mobile-menu{
display:none;
position:absolute;
right:10px;
top:60px;
background:#170028;
border:1px solid #8b5cf6;
border-radius:12px;
width:220px;
z-index:1000;
}

.mobile-menu a{
display:block;
padding:12px;
color:white;
text-decoration:none;
border-bottom:1px solid #222;
}

/* BANNER CLEAN */
.banner img{
width:100%;
height:260px;
object-fit:cover;
}

/* TOP MENU */
.top-menu{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:12px;
}

.menu-card{
background:#140022;
border:1px solid #8b5cf6;
border-radius:12px;
padding:10px;
text-align:center;
cursor:pointer;
font-size:12px;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:12px;
}

.card{
background:#140022;
border-radius:12px;
overflow:hidden;
border:1px solid #8b5cf6;
}

.card img{
width:100%;
height:120px;
object-fit:cover;
}

.card-content{
padding:8px;
}

.btn{
width:100%;
padding:10px;
border:none;
background:#7c3aed;
color:white;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:6px;
}

/* OVERLAY */
.overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
justify-content:center;
align-items:center;
z-index:9999;
}

.popup{
background:#150025;
padding:18px;
border-radius:12px;
width:90%;
max-width:350px;
}

input{
width:100%;
padding:10px;
margin-bottom:8px;
border:none;
border-radius:8px;
background:#25003d;
color:white;
}

/* QRIS */
.qris{
width:240px;
display:block;
margin:auto;
margin-bottom:10px;
border-radius:12px;
}

/* CREDITS */
.credits{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
background:#150025;
padding:8px 12px;
border-radius:10px;
border:1px solid #8b5cf6;
font-size:12px;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<div style="display:flex;gap:10px;align-items:center;">
<img class="logo-img" src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png">
<div class="logo">IPUNGG SHOP</div>
</div>

<div class="hamburger" onclick="toggleMenu(event)">☰</div>

<div class="mobile-menu" id="menu">
<a href="https://wa.me/6285198959920">💬 Kontak Admin</a>
<a href="#">👥 Grup Official</a>
<a href="#">📢 Channel Official</a>
<a href="admin.html">🛠 Dashboard Admin</a>
</div>
</nav>

<!-- BANNER CLEAN -->
<div class="banner">
<img id="bannerImg"
src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
</div>

<!-- TOP MENU -->
<div class="top-menu">

<div class="menu-card" onclick="showCategory('all')">SEMUA</div>
<div class="menu-card" onclick="showCategory('bot')">SEWA BOT</div>
<div class="menu-card" onclick="showCategory('panel')">PANEL PTRODACTYL</div>
<div class="menu-card" onclick="showCategory('script')">SCRIPT</div>

</div>

<!-- PRODUCTS -->
<div class="products"></div>

<!-- ORDER -->
<div class="overlay" id="overlay">
<div class="popup">

<div id="step1">

<h3>FORM ORDER</h3>

<input id="nama" placeholder="Nama">
<input id="product" readonly>
<input id="date" readonly>
<input value="QRIS" readonly>

<button class="btn" onclick="nextStep()">LANJUT</button>

</div>

<div id="step2" style="display:none;">

<img class="qris"
src="http://rahmad-elaina.my.id/file/32310f673a.jpg">

<button class="btn" onclick="downloadQRIS()">
⬇ DOWNLOAD QRIS
</button>

<input type="file" id="bukti">

<button class="btn" onclick="sendWA()">
KIRIM BUKTI
</button>

</div>

</div>
</div>

<div class="credits">© Mezuki X Ipungg 2026</div>

<script>

/* MENU FIX (NO BUG) */
function toggleMenu(event){

if(event) event.stopPropagation();

let m=document.getElementById("menu");

m.style.display = (m.style.display === "block") ? "none" : "block";
}

/* CLOSE MENU CLICK OUTSIDE */
document.addEventListener("click",function(e){

const menu=document.getElementById("menu");
const ham=document.querySelector(".hamburger");

if(!menu.contains(e.target) && !ham.contains(e.target)){
menu.style.display="none";
}

});

/* PRODUCTS */
const products=[
{name:"Bot WhatsApp",category:"bot",image:"https://images.unsplash.com/photo-1555949963"},
{name:"Panel Pterodactyl",category:"panel",image:"https://images.unsplash.com/photo-1558494949"},
{name:"Script Premium",category:"script",image:"https://images.unsplash.com/photo-1526374965328"}
];

function loadProducts(){
const box=document.querySelector(".products");
box.innerHTML="";

products.forEach(p=>{
box.innerHTML+=`
<div class="card ${p.category}">
<img src="${p.image}">
<div class="card-content">
<h4>${p.name}</h4>
<button class="btn" onclick="openOrder('${p.name}')">ORDER</button>
</div>
</div>`;
});
}
loadProducts();

/* FILTER */
function showCategory(cat){
document.querySelectorAll(".card").forEach(c=>{
c.style.display=(cat==="all"||c.classList.contains(cat))?"block":"none";
});
}

/* ORDER */
function openOrder(name){
document.getElementById("overlay").style.display="flex";

document.getElementById("step1").style.display="block";
document.getElementById("step2").style.display="none";

document.getElementById("product").value=name;
document.getElementById("date").value=new Date().toLocaleDateString("id-ID");
}

function nextStep(){
document.getElementById("step1").style.display="none";
document.getElementById("step2").style.display="block";
}

/* QRIS DOWNLOAD */
function downloadQRIS(){
const img=document.querySelector(".qris");

const a=document.createElement("a");
a.href=img.src;
a.download="QRIS.jpg";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
}

/* WA SEND */
function sendWA(){
const nama=document.getElementById("nama").value;
const product=document.getElementById("product").value;
const date=document.getElementById("date").value;

const text=`
ORDER BARU
Nama:${nama}
Produk:${product}
Tanggal:${date}
`;

window.open(
`https://wa.me/6285198959920?text=${encodeURIComponent(text)}`
);
}

</script>

</body>
  </html>
