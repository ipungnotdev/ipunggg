<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#090014;
color:white;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px;
background:#120020;
position:sticky;
top:0;
z-index:999;
}

.logo-img{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
}

.logo{
font-size:20px;
font-weight:bold;
}

.hamburger{
font-size:28px;
cursor:pointer;
}

/* MENU */
.menu{
display:none;
position:absolute;
top:60px;
right:15px;
background:#170028;
border:1px solid #8b5cf6;
border-radius:16px;
width:220px;
overflow:hidden;
}

.menu a{
display:block;
padding:14px;
color:white;
text-decoration:none;
border-bottom:1px solid rgba(255,255,255,.1);
}

/* BANNER */
.banner img{
width:100%;
height:220px;
object-fit:cover;
}

/* CATEGORY */
.category{
display:flex;
gap:10px;
padding:12px;
overflow-x:auto;
}

.category button{
padding:10px 14px;
border:none;
border-radius:12px;
background:#7c3aed;
color:white;
font-weight:bold;
white-space:nowrap;
cursor:pointer;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
padding:14px;
}

.card{
background:#160025;
border-radius:18px;
overflow:hidden;
border:1px solid #8b5cf6;
}

.card img{
width:100%;
height:120px;
object-fit:cover;
}

.card-content{
padding:10px;
}

.btn{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<!-- NAV -->
<nav>

<div style="display:flex;align-items:center;gap:10px;">
<img class="logo-img">
<div class="logo">IPUNGG SHOP</div>
</div>

<div class="hamburger" onclick="toggleMenu()">☰</div>

<div class="menu" id="menu">

<a href="admin.html">⚙️ Admin</a>
<a id="waLink">📞 WA</a>
<a id="chLink">📢 Channel</a>
<a id="grLink">👥 Group</a>

</div>

</nav>

<!-- BANNER -->
<div class="banner">
<img id="bannerImage">
</div>

<!-- CATEGORY (AUTO) -->
<div class="category" id="categoryBox"></div>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<script>

/* INIT DEFAULT */
if(!localStorage.getItem("products")){
localStorage.setItem("products","[]");
}

if(!localStorage.getItem("categories")){
localStorage.setItem("categories",JSON.stringify(["panel","bot","script"]));
}

/* MENU */
function toggleMenu(){
let m=document.getElementById("menu");
m.style.display = m.style.display==="block"?"none":"block";
}

/* LOAD SETTINGS */
function loadSettings(){

let logo=localStorage.getItem("logo");
if(logo) document.querySelector(".logo-img").src=logo;

let banner=localStorage.getItem("banner");
if(banner) document.getElementById("bannerImage").src=banner;

let wa=localStorage.getItem("wa");
if(wa) document.getElementById("waLink").href="https://wa.me/"+wa;

let ch=localStorage.getItem("channel");
if(ch) document.getElementById("chLink").href=ch;

let gr=localStorage.getItem("group");
if(gr) document.getElementById("grLink").href=gr;

}

/* LOAD CATEGORY FIX */
function loadCategories(){

let data=JSON.parse(localStorage.getItem("categories")) || [];

let box=document.getElementById("categoryBox");

box.innerHTML="";

/* default ALL */

data.forEach(c=>{
box.innerHTML+=`
<button onclick="filter('${c}')">${c.toUpperCase()}</button>
`;
});

}

/* LOAD PRODUCTS */
function loadProducts(){

let data=JSON.parse(localStorage.getItem("products")) || [];

let box=document.getElementById("products");

box.innerHTML="";

data.forEach(p=>{
box.innerHTML+=`
<div class="card ${p.category}">
<img src="${p.image}">
<div class="card-content">
<h3>${p.name}</h3>
<p>${p.price}</p>
<button class="btn">ORDER</button>
</div>
</div>
`;
});

}

/* FILTER CATEGORY */
function filter(cat){

let items=document.querySelectorAll(".card");

items.forEach(i=>{

if(cat==="all"){
i.style.display="block";
}else{
i.classList.contains(cat)
? i.style.display="block"
: i.style.display="none";
}

});

}

/* INIT */
loadSettings();
loadCategories();
loadProducts();

</script>

</body>
</html>
