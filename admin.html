<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN IPUNGG SHOP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#090014;
color:white;
padding:20px;
}

.title{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
text-align:center;
}

.box{
background:#150025;
border:1px solid #8b5cf6;
padding:20px;
border-radius:24px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(168,85,247,.5);
}

.box h2{
margin-bottom:15px;
font-size:20px;
}

.box input,
.box select{
width:100%;
padding:14px;
margin-bottom:12px;
border:none;
border-radius:14px;
background:#25003d;
color:white;
font-size:15px;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#7c3aed;
color:white;
font-weight:bold;
cursor:pointer;
font-size:15px;
}

.btn:hover{
opacity:.9;
}

.preview{
width:100%;
height:180px;
object-fit:cover;
border-radius:20px;
margin-top:10px;
border:1px solid #8b5cf6;
}

.note{
margin-top:10px;
opacity:.7;
font-size:13px;
}

</style>

</head>
<body>

<div class="title">
ADMIN IPUNGG SHOP
</div>

<div class="box">

<h2>SETTINGS NAMA STORE</h2>

<input 
type="text" 
id="storeName" 
placeholder="Masukkan Nama Store"
>

<button class="btn" onclick="saveStoreName()">
SIMPAN NAMA STORE
</button>

</div>

<div class="box">

<h2>SETTINGS BANNER</h2>

<input 
type="text" 
id="bannerUrl" 
placeholder="Masukkan URL Banner"
>

<button class="btn" onclick="saveBanner()">
SIMPAN BANNER
</button>

<img 
id="bannerPreview"
class="preview"
src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1200"
>

</div>

<div class="box">

<h2>TAMBAH PRODUK</h2>

<input 
type="text" 
id="productName" 
placeholder="Nama Produk"
>

<input 
type="text" 
id="productPrice" 
placeholder="Harga Produk"
>

<input 
type="text" 
id="productImage" 
placeholder="URL Thumbnail"
>

<select id="productCategory">

<option value="bot">SEWA BOT</option>
<option value="panel">PANEL</option>
<option value="script">SOURCE CODE</option>

</select>

<input 
type="text" 
id="newCategory"
placeholder="Tambah Kategori Baru"
>

<button class="btn" onclick="addCategory()">
TAMBAH KATEGORI
</button>

<br><br>

<button class="btn" onclick="addProduct()">
TAMBAH PRODUK
</button>

<div class="note">
Produk tersimpan otomatis ke LocalStorage
</div>

</div>

<div class="box">

<h2>UBAH PASSWORD ADMIN</h2>

<input 
type="password" 
id="newPassword" 
placeholder="Password Baru"
>

<button class="btn" onclick="changePassword()">
UBAH PASSWORD
</button>

</div>

<script>

if(!localStorage.getItem('adminPassword')){
localStorage.setItem('adminPassword','1');
}

const pass=prompt('Masukkan Password Admin');

if(pass!==localStorage.getItem('adminPassword')){
alert('Password Salah');
window.location.href='index.html';
}

function saveStoreName(){

const name=
document.getElementById('storeName').value;

localStorage.setItem('storeName',name);

alert('Nama store berhasil disimpan');

}

function saveBanner(){

const url=
document.getElementById('bannerUrl').value;

localStorage.setItem('banner',url);

document.getElementById('bannerPreview').src=url;

alert('Banner berhasil disimpan');

}

function addCategory(){

const newCategory=
document.getElementById('newCategory').value;

if(!newCategory) return;

const select=
document.getElementById('productCategory');

const option=document.createElement('option');

option.value=newCategory.toLowerCase();

option.textContent=
newCategory.toUpperCase();

select.appendChild(option);

alert('Kategori berhasil ditambahkan');

}

function addProduct(){

const name=
document.getElementById('productName').value;

const price=
document.getElementById('productPrice').value;

const image=
document.getElementById('productImage').value;

const category=
document.getElementById('productCategory').value;

const product={
name,
price,
image,
category
};

let products=
JSON.parse(localStorage.getItem('products')) || [];

products.push(product);

localStorage.setItem(
'products',
JSON.stringify(products)
);

alert('Produk berhasil ditambahkan');

}

function changePassword(){

const pass=
document.getElementById('newPassword').value;

localStorage.setItem('adminPassword',pass);

alert('Password berhasil diubah');

}

</script>

</body>
</html>
